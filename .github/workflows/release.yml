name: Release and package
on:
  workflow_dispatch:
permissions:
  contents: write
  packages: write
concurrency:
  group: release-publication
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Set version and image
        run: |
          python - <<'PY'
          import os, re, tomllib
          version = tomllib.load(open('pyproject.toml', 'rb'))['project']['version']
          assert re.fullmatch(r'\d+\.\d+\.\d+', version)
          with open(os.environ['GITHUB_ENV'], 'a') as out:
              out.write(f'TAG=v{version}\n')
              out.write('IMAGE=ghcr.io/' + os.environ['GITHUB_REPOSITORY'].lower() + '\n')
          PY
      - name: Require a new version
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo 'Release already exists. Increase the version before publishing again.'
            exit 1
          fi
      - run: python -m pip install -r requirements.lock
      - run: python -m pip install --no-deps --no-build-isolation -e .
      - run: python -m pip check
      - run: python -m ruff check .
      - run: python -m ruff format --check .
      - run: python -m pytest -q
      - run: python -m build --wheel --no-isolation
      - run: git archive --format=zip --prefix=secure-mcp-enterprise-toolkit/ --output="dist/secure-mcp-enterprise-toolkit-$TAG.zip" HEAD
      - name: Build and smoke test image
        run: |
          docker build --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" -t "$IMAGE:$TAG" .
          docker run -d --name toolkit -p 127.0.0.1:8000:8000 "$IMAGE:$TAG"
          trap 'docker logs toolkit; docker rm -f toolkit' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8000/health; then exit 0; fi
            sleep 2
          done
          exit 1
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - run: docker push "$IMAGE:$TAG"
      - run: gh release create "$TAG" dist/* --target "$GITHUB_SHA" --title "Gatehouse $TAG" --notes-file RELEASE_NOTES.md
